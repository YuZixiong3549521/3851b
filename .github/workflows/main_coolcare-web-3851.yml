# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - coolcare-web-3851

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

# One production publishing operation at a time. Never interrupt an active
# OneDeploy upload when another team member pushes to main.
concurrency:
  group: coolcare-web-3851-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies and build
        working-directory: ./coolcare
        run: |
          npm ci --include=dev
          npm ci --prefix technician --include=dev
          npm test
          npm test --prefix technician
          npm run build
          node --test tests/production-smoke.mjs
      - name: Package production application
        working-directory: ./coolcare
        run: |
          mkdir -p ../deploy
          tar --exclude='./.env' --exclude='./.env.*' --exclude='./.local' --exclude='./.git' --exclude='./technician/node_modules' --exclude='./node_modules/.cache' -czf ../deploy/app.tar.gz .
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./deploy/app.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Extract production application
        run: |
          mkdir app
          tar -xzf app.tar.gz -C app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FFA520625E194685B40F6C259206C0CA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2836C08E3D93459191A54827CA1AF54B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A6CFC0D46794402A84E768EC7E3567B1 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'coolcare-web-3851'
          slot-name: 'Production'
          package: ./app
          startup-command: 'npm start'

