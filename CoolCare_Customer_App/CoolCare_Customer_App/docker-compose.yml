services:
  database:
    image: mysql:8.4
    container_name: coolcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-coolcare_dev}
      MYSQL_DATABASE: coolcare_service_app
    ports:
      - "3307:3306"
    volumes:
      - coolcare_mysql_data:/var/lib/mysql
      - ../CoolCare_Database_Handover/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../CoolCare_Database_Handover/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  coolcare_mysql_data:
