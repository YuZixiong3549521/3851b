services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup first}
      MYSQL_DATABASE: coolcare_service_app
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - coolcare_unified_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/03-inventory-web.sql:/docker-entrypoint-initdb.d/03-inventory-web.sql:ro
      - ./.local/04-app-user.sql:/docker-entrypoint-initdb.d/04-app-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  coolcare_unified_data:
